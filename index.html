<style>
/* Layout: full-screen game. HUD floats over the 3D view: money top-left, chat bar top-centre, buttons top-right, context panel bottom-centre. Single dark luxe look by choice. */
:root{
  --bg:#0d0a10; --glass:rgba(18,12,22,.78); --glass2:rgba(40,28,44,.92); --line:rgba(255,214,140,.28);
  --fg:#fbf6ee; --muted:#cbb9a6; --gold:#f6c45a; --red:#ff5a4f; --green:#3ddc84; --blue:#6cc0ff; --purple:#b46bff;
  --display:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
button{font-family:var(--body);cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.game{position:fixed;inset:0;overflow:hidden;background:#05040a;touch-action:none;user-select:none;-webkit-user-select:none}
.game canvas{display:block;width:100%;height:100%;cursor:grab}
.game canvas:active{cursor:grabbing}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-weight:600;font-size:13px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#16122a;font-weight:800;font-size:13px;padding:6px 10px;border-radius:12px;max-width:220px;line-height:1.25;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:opacity .2s}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.off,.prompt.off,.float.off{opacity:0}
.lbx i{position:absolute;left:0;right:0;height:0;background:#000;transition:height .45s ease;z-index:4;pointer-events:none}.lbx i:first-child{top:0}.lbx i:last-child{bottom:0}.lbx.on i{height:10vh}
.cinema .hud-tr,.cinema #ctx,.cinema .help,.cinema .chatbar,.cinema .sub,.cinema #joy,.cinema #tJump,.cinema #tAct{opacity:0!important;pointer-events:none!important;transition:opacity .3s}
.vs{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:5;pointer-events:none;display:flex;align-items:center;gap:18px;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .25s}
.vs.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.vs-l,.vs-r{background:linear-gradient(180deg,#2f6fe0,#183a8a);border:3px solid #fff;border-radius:14px;padding:10px 18px;text-align:center;min-width:120px;color:#fff;animation:inl .5s}.vs-r{background:linear-gradient(180deg,#d8432b,#7a1a10);animation:inr .5s}
.vs b{display:block;font:700 clamp(16px,2.6vw,26px) var(--display)}.vs small{display:block;font-weight:800;opacity:.9}
.vs-m{font:700 clamp(30px,6vw,64px) var(--display);color:var(--gold);text-shadow:0 0 18px rgba(255,180,40,.8),0 3px 0 #6a3a00;text-align:center}.vs-m small{font:700 14px var(--body,Nunito);color:#fff;text-shadow:none}
@keyframes inl{from{transform:translateX(-120px);opacity:0}}@keyframes inr{from{transform:translateX(120px);opacity:0}}
.vs-big{font:700 clamp(40px,9vw,96px) var(--display);text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 30px currentColor}.vs-big.win{color:#ffe28a}.vs-big.lose{color:#ff7b72}.vs-big small{font-size:.35em;color:#fff}
.flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}.flashfx.go{animation:flash .5s ease-out}@keyframes flash{0%{opacity:.75}100%{opacity:0}}
.shake{animation:shk .45s}@keyframes shk{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.panel.fxspin{animation:glow .5s ease-in-out infinite alternate}@keyframes glow{from{box-shadow:0 0 0 rgba(246,196,90,0),0 10px 40px rgba(0,0,0,.6)}to{box-shadow:0 0 34px rgba(246,196,90,.85),0 10px 40px rgba(0,0,0,.6)}}
.panel{position:relative}.pflash{position:absolute;inset:0;border-radius:14px;background:radial-gradient(circle,rgba(255,226,138,.75),rgba(255,226,138,0) 70%);pointer-events:none;animation:flash .7s ease-out forwards}
.panel.fxlose{animation:shk .4s}

.shopm{padding:8px;z-index:7}
.shop{width:min(920px,100%);height:min(600px,100%);background:#f4e7cc;border:4px solid #1d4fb8;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;color:#2b2b3a;box-shadow:0 12px 50px rgba(0,0,0,.6)}

.shop-b{flex:1;display:flex;min-height:0;padding:8px;gap:8px}

.stabs button.on{background:linear-gradient(180deg,#3a8af0,#1d4fb8);color:#fff}.stabs small{background:rgba(0,0,0,.14);border-radius:8px;padding:0 6px;font-size:11px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;padding:2px 2px 10px}
.card{background:#fffaf0;border:2px solid var(--rc);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.card .img{width:100%;height:66px;border-radius:9px;background:radial-gradient(circle at 50% 40%,#2f5fb8,#0f2557);display:grid;place-items:center;font-size:36px;position:relative;margin-bottom:2px}
.tag2{position:absolute;top:4px;right:4px;font:700 10px var(--display);background:#e2433a;color:#fff;border-radius:6px;padding:1px 5px}
.card b{font:600 14px var(--display);line-height:1.15}.card .rr{font-size:12px;font-weight:800;color:var(--rc)}
.shop .chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:2px 0}.shop .chips span{background:#dff3e3;color:#1f7a3a;border-radius:10px;padding:1px 7px;font-size:12px;font-weight:800}
.buy2{margin-top:auto;width:100%;min-height:36px;border:0;border-radius:10px;background:linear-gradient(180deg,#ffd76a,#f0a91c);box-shadow:0 3px 0 #b97a0a;font:700 15px var(--display);color:#4a2a00}
.buy2:disabled{filter:grayscale(.5);opacity:.55}.buy2 s{opacity:.6;font-size:12px;margin-right:4px}
.buy2.eq{background:#e6edf9;box-shadow:0 3px 0 #b7c3dc;color:#1d4fb8}.buy2.on{background:transparent;box-shadow:none;color:#1f9d55;opacity:1;filter:none}.buy2.green{background:linear-gradient(180deg,#3fbf6a,#1f8a45);box-shadow:0 3px 0 #146333;color:#fff}
.sec-t{font:600 14px var(--display);color:#5a4a30;margin:2px 4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding-bottom:10px}
.pk{background:#fffaf0;border:2px solid #e3cc9c;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:8px;text-align:center}
.pk>*:not(h5){margin-left:8px;margin-right:8px}.pk .buy2{width:calc(100% - 16px)}
.pk h5{align-self:stretch;margin:0;background:linear-gradient(90deg,#3a8af0,#1d4fb8);color:#fff;padding:6px 10px;font:600 14px var(--display);text-align:left;clip-path:polygon(0 0,100% 0,93% 100%,0 100%)}
.pk.free{border-color:#3fbf6a}.pk.free h5{background:linear-gradient(90deg,#3fbf6a,#1f8a45)}
.pki{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.pki span{position:relative;width:44px;height:44px;border-radius:10px;background:#f1e3c4;border:2px solid var(--rc,#d8bf8a);display:grid;place-items:center;font-size:24px}.pki span.own{opacity:.45}.pki i{position:absolute;bottom:-6px;right:-6px;background:#2b2b3a;color:#fff;font:700 10px var(--display);font-style:normal;border-radius:6px;padding:0 4px}
.pk small{color:#7a6a50;font-size:12px}.okc{color:#1f9d55}
.pk.pass h5{background:linear-gradient(180deg,#a0582a,#7a3e18);clip-path:none;text-align:center}.pbig2{width:calc(100% - 16px);height:70px;border-radius:10px;background:radial-gradient(circle,#fff1c8,#f7c97a);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px}.pbig2 em{font:700 11px var(--display);font-style:normal;background:#7b3fe4;color:#fff;border-radius:8px;padding:1px 8px}
.pk ul{margin:0;padding:6px 8px 6px 24px;text-align:left;font-size:13px;background:#fff;border-radius:8px;align-self:stretch}
.gbanner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,#3b1f7a,#7a2fc0);color:#fff;border-radius:12px;padding:12px}.gbanner small{display:block;opacity:.85}.gbanner b{font:600 18px var(--display)}.gbtn{display:flex;gap:6px}.gbtn .buy2{width:auto;padding:0 14px}
.gres{display:flex;gap:6px;flex-wrap:wrap}.gr{width:84px;background:#fffaf0;border:2px solid var(--rc);border-radius:10px;padding:6px;text-align:center;animation:pop .35s}.gr span{font-size:28px;display:block}.gr b{font-size:11px;display:block;line-height:1.1}.gr small{font-size:10px;color:var(--rc)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.rates{background:#fffaf0;border-radius:12px;padding:4px 10px}.rate{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #eadcbc;font-size:13px}.rate div{flex:1}.rate small{display:block;font-weight:800}.rate .ri{font-size:22px}
.tashead{display:flex;align-items:center;gap:10px;background:#fffaf0;border-radius:12px;padding:10px}.tashead div{flex:1}.tashead .chips{justify-content:flex-start}.tashead small{color:#7a6a50}.tashead .buy2{width:auto;padding:0 14px;margin:0}
@media (max-width:640px),(max-height:440px){.side{width:76px}.side button{flex-direction:column;gap:1px;padding:6px 2px;font-size:10.5px;text-align:center}.shop-h h3{font-size:16px}.pill.lk{display:none}.sgrid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}.card .img{height:50px;font-size:28px}.card b{font-size:12.5px}.buy2{font-size:13px;min-height:32px}.shop-b{padding:6px;gap:6px}.stabs button{font-size:12.5px;padding:6px 8px}}

.setb{display:flex;flex-direction:column;gap:10px}.setg{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}.setg h4{margin:0;color:var(--gold);font-family:var(--display)}
.rng{display:flex;align-items:center;gap:10px}.rng span{flex:0 0 110px}.rng input{flex:1;accent-color:var(--gold)}.rng b{width:44px;text-align:right}
.slotr{display:flex;align-items:center;gap:8px}.slotr div{flex:1}.slotr small{display:block;color:var(--muted)}
.setg textarea{width:100%;background:rgba(0,0,0,.35);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px monospace;resize:vertical}
.srow{display:flex;gap:6px;flex-wrap:wrap}
.ytcard{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));z-index:6;background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:6px;width:212px;box-shadow:0 8px 24px rgba(0,0,0,.5)}.yth{display:flex;align-items:center;gap:4px;cursor:grab;touch-action:none;padding-bottom:5px}.yth b{flex:1;min-width:0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.yth button{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.1);border:0;font-size:12px;padding:0}#ytBox{width:200px;height:200px;border-radius:8px;overflow:hidden;background:#000}.ytc{display:block;font-size:10px;color:var(--muted);text-align:center;margin-top:3px}

.app{position:relative}.qdot{position:absolute;top:0;right:6px;background:var(--red);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:8px;min-width:15px;padding:0 3px}

.buy2.dia{background:linear-gradient(180deg,#6fd8ff,#1f7fd0);color:#fff}.pk.hot{outline:3px solid #ffd25f;box-shadow:0 0 18px rgba(255,210,95,.5)}

.mpchat{display:none;gap:6px}.chatpanel.mpc .mpchat{display:flex}.mpchat input{flex:1;min-width:0;min-height:42px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--fg);padding:0 10px;font:inherit}

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const stage=$('stage'),ov=$('ov');
if(!window.THREE){stage.insertAdjacentHTML('beforeend','<div class="err">Mesin 3D gagal dimuat. Muat ulang halaman.</div>');return;}
const fmt=n=>n.toLocaleString('id-ID');
const HOST="Bang Rio";

/* ---------- state ---------- */
let S={bal:1000,bet:0,wins:0,losses:0,hist:[]};
try{const s=JSON.parse(localStorage.getItem('lounge-reme-3d')||'null');if(s&&typeof s.bal==='number')S=Object.assign(S,s,{bet:0});}catch(e){}
function save(){try{localStorage.setItem('lounge-reme-3d',JSON.stringify({bal:S.bal,wins:S.wins,losses:S.losses,hist:S.hist}));}catch(e){}}
let busy=false,started=false,tieHost=true;

/* ---------- audio (synthesized) ---------- */
let SET={sfx:60,music:false,mv:50};try{Object.assign(SET,JSON.parse(localStorage.getItem('lounge-vegas-set')||'{}'));}catch(e){}
let AC=null,master=null,mus=null,sfxOn=SET.sfx>0,musicOn=false,musicTimer=null;
const saveSet=()=>{try{localStorage.setItem('lounge-vegas-set',JSON.stringify(SET));}catch(e){}};
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=SET.sfx/100;master.connect(AC.destination);mus=AC.createGain();mus.gain.value=SET.mv/100;mus.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type='square',vol=.12,when=0,slideTo=null){if(!AC||!sfxOn||vol<=0.001)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}
function noise(d,vol=.1,when=0,hp=2000){if(!AC||!sfxOn||vol<=0.001)return;const t=AC.currentTime+when,len=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,len,AC.sampleRate),a=buf.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='highpass';f.frequency.value=hp;s.buffer=buf;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(t);}
const SFX={
  chip(){tone(2100,.05,'triangle',.12);tone(2900,.06,'triangle',.08,.03);noise(.04,.06,0,4000);},
  tick(p,v=1){tone(1000+p*500,.02,'square',.05*v);noise(.015,.03*v,0,5000);},
  pop(){tone(520,.05,'sine',.1,0,880);},
  jump(){tone(260,.14,'triangle',.12,0,620);},
  land(){noise(.05,.05,0,800);},
  step(){noise(.025,.03,0,2500);},
  spinStart(v=1){tone(180,.3,'sawtooth',.06*v,0,560);noise(.3,.05*v,0,1500);},
  stop(v=1){tone(660,.08,'square',.1*v);tone(990,.14,'square',.1*v,.08);},
  coin(w=0){tone(988,.07,'square',.09,w);tone(1319,.22,'square',.09,w+.07);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.1,i*.1));for(let i=0;i<6;i++)SFX.coin(.45+i*.08);},
  big(){[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,.15,'square',.11,i*.09));tone(1568,.6,'triangle',.08,.75);for(let i=0;i<12;i++)SFX.coin(.8+i*.06);},
  lose(){[392,349,311,262].forEach((f,i)=>tone(f,.22,'sawtooth',.07,i*.16));},
  error(){tone(160,.15,'square',.08);}
};
const prog=[[220,277,330],[196,247,294],[175,220,262],[196,247,311]];let mstep=0;
/* ---------- music: original synth styles + YouTube player for NCS / any link ---------- */
const STYLES=[
  {id:'lounge',n:'Lounge Jazz',d:'Santai, piano lembut',step:300,prog:[[220,277,330],[196,247,294],[175,220,262],[196,247,294]],bass:'triangle',arp:'sine',arpEvery:4,kick:0,pad:1},
  {id:'neon',n:'Neon Drive',d:'Synthwave malam kota',step:135,prog:[[220,262,330],[175,220,262],[262,330,392],[196,247,294]],bass:'sawtooth',arp:'square',arpEvery:1,kick:1,pad:0},
  {id:'house',n:'Deep House',d:'Beat empat ketukan',step:125,prog:[[196,233,294],[175,220,262],[156,196,233],[175,220,262]],bass:'sine',arp:'triangle',arpEvery:2,kick:1,clap:1,pad:1},
  {id:'arcade',n:'Arcade Rush',d:'Chiptune cepat',step:105,prog:[[262,330,392],[220,262,330],[175,220,262],[196,247,294]],bass:'square',arp:'square',arpEvery:1,kick:1,pad:0},
  {id:'chill',n:'Tropical Chill',d:'Pantai dan kelapa',step:165,prog:[[247,311,370],[208,262,311],[185,233,277],[220,277,330]],bass:'triangle',arp:'sine',arpEvery:2,kick:1,clap:1,pad:1}
];
const NCS=[
  {n:'Diviners - Savannah (feat. Philly K)',id:'a753TBjVVDA'},
  {n:'Cadmium - Ghost (feat. Eli Raain)',id:'gTt4rSEkHKY'},
  {n:'Jonny Koch & Annie Sollange - LOVE ME',id:'9cF1JzIzzAo'},
  {n:'Cartoon, Jéja - On & On (feat. Daniel Levi)',id:'K4DyBUG242c'},
  {n:'Alan Walker - Fade',id:'bM7SZ5SBzyY'},
  {n:'Janji - Heroes Tonight (feat. Johnning)',id:'3nQNiWdeH2Q'},
  {n:'Different Heaven & EH!DE - My Heart',id:'jK2aIUmmdP4'},
  {n:'Elektronomia - Sky High',id:'TW9d8vYrVFQ'},
  {n:'Disfigure - Blank',id:'p7ZsBPK656s'},
  {n:'Tobu - Candyland',id:'IIrCDAV3EgI'},
  {n:'Lost Sky - Dreams',id:'L7kF4MXXCoA'}
];
let mstepX=0,noiseBuf=null;
function styleNow(){return STYLES.find(x=>x.id===SET.style)||STYLES[0];}
function noiseHit(t,dur,vol,hp){if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(mus);s.start(t);s.stop(t+dur+.02);}
function mtone(type,f,t,dur,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(mus);o.start(t);o.stop(t+dur+.05);}
function musicTick(){if(!AC||!musicOn)return;const st=styleNow(),i=mstepX%16,c=st.prog[Math.floor(mstepX/16)%4],t=AC.currentTime+.02,sd=st.step/1000;
  if(st.id==='lounge'){const beat=mstepX%4;mtone('triangle',c[0]/2,t,.35,.08);if(beat===1||beat===3)c.forEach(f=>mtone('sine',f*2,t,.25,.025));mstepX++;return;}
  if(st.kick&&i%4===0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(mus);o.start(t);o.stop(t+.2);}
  if(i%2===1)noiseHit(t,.04,.035,7000);
  if(st.clap&&(i===4||i===12))noiseHit(t,.12,.07,1500);
  if(i%2===0)mtone(st.bass,(i%8===6?c[1]:c[0])/2,t,sd*1.8,st.bass==='sawtooth'?.035:.06);
  if(i%st.arpEvery===0){const n=c[(i/st.arpEvery)%3|0]*(i%8<4?2:4);mtone(st.arp,n,t,sd*1.4,st.arp==='square'?.014:.03);}
  if(st.pad&&i===0)c.forEach(f=>mtone('sine',f,t,sd*15,.018));
  mstepX++;}
function restartMusicTimer(){clearInterval(musicTimer);if(musicOn){audio();musicTimer=setInterval(musicTick,styleNow().step);}}

/* YouTube mini player (kept at least 200x200 and visible, as YouTube requires) */
const YT={api:null,player:null,q:[],i:0,ready:false,loading:false,title:''};
function ytLoad(){return new Promise((res,rej)=>{if(window.YT&&window.YT.Player)return res();if(YT.loading){const w=setInterval(()=>{if(window.YT&&window.YT.Player){clearInterval(w);res();}},200);return;}
  YT.loading=true;window.onYouTubeIframeAPIReady=()=>res();const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>rej(new Error('yt'));document.head.appendChild(s);setTimeout(()=>{if(!(window.YT&&window.YT.Player))rej(new Error('timeout'));},12000);});}
function ytParse(u){u=String(u||'').trim();const list=u.match(/[?&]list=([\w-]+)/),v=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/)||u.match(/^([\w-]{11})$/);return {list:list&&list[1],id:v&&v[1]};}
function ytCard(){let c=$('ytCard');if(c)return c;c=document.createElement('div');c.id='ytCard';c.className='ytcard';
  c.innerHTML=`<div class="yth" title="Geser untuk pindah"><span>🎵</span><b id="ytT">Memuat...</b><button data-y="prev" aria-label="Lagu sebelumnya">⏮</button><button data-y="play" aria-label="Putar/jeda">⏯</button><button data-y="next" aria-label="Lagu berikutnya">⏭</button><button data-y="x" aria-label="Tutup pemutar">✕</button></div><div id="ytBox"><div id="ytFrame"></div></div><small class="ytc">Musik dari YouTube</small>`;
  stage.appendChild(c);try{const ps=JSON.parse(localStorage.getItem('lounge-yt-pos')||'null');if(ps){c.style.left=ps[0]+'px';c.style.top=ps[1]+'px';}}catch(e){}
  c.querySelector('[data-y="x"]').onclick=ytStop;c.querySelector('[data-y="next"]').onclick=()=>ytStep(1);c.querySelector('[data-y="prev"]').onclick=()=>ytStep(-1);
  c.querySelector('[data-y="play"]').onclick=()=>{const p=YT.player;if(!p||!p.getPlayerState)return;p.getPlayerState()===1?p.pauseVideo():p.playVideo();};
  const h=c.querySelector('.yth');let drag=null;h.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;drag={x:e.clientX-c.offsetLeft,y:e.clientY-c.offsetTop};h.setPointerCapture(e.pointerId);});
  h.addEventListener('pointermove',e=>{if(!drag)return;const r=stage.getBoundingClientRect();const x=Math.max(0,Math.min(r.width-c.offsetWidth,e.clientX-drag.x)),y=Math.max(0,Math.min(r.height-c.offsetHeight,e.clientY-drag.y));c.style.left=x+'px';c.style.top=y+'px';c.style.right='auto';});
  h.addEventListener('pointerup',()=>{if(drag){drag=null;try{localStorage.setItem('lounge-yt-pos',JSON.stringify([c.offsetLeft,c.offsetTop]));}catch(e){}}});
  return c;}
async function ytPlay(opts){
  ytCard();$('ytT').textContent='Memuat...';SET.music=false;applyAudio();
  try{await ytLoad();}catch(e){$('ytT').textContent='YouTube tidak bisa dimuat di sini.';logLine('sys',null,'Pemutar YouTube tidak bisa dimuat. Coba buka game lewat link GitHub dan cek internet.');return;}
  const vol=SET.mv;const ev={onReady:e=>{e.target.setVolume(vol);e.target.playVideo();ytTitle();},onStateChange:e=>{if(e.data===0&&!opts.list)ytStep(1);ytTitle();},onError:()=>{logLine('sys',null,'Lagu ini tidak bisa diputar di luar YouTube, lanjut ke lagu berikutnya.');setTimeout(()=>ytStep(1),800);}};
  YT.list=opts.list||null;if(opts.q){YT.q=opts.q;YT.i=opts.i||0;}
  const pv=opts.list?{listType:'playlist',list:opts.list,autoplay:1,playsinline:1}:{autoplay:1,playsinline:1,rel:0};
  if(YT.player&&YT.player.loadVideoById){if(opts.list)YT.player.loadPlaylist({list:opts.list,listType:'playlist'});else YT.player.loadVideoById(YT.q[YT.i].id);YT.player.setVolume(vol);setTimeout(ytTitle,1500);return;}
  YT.player=new window.YT.Player('ytFrame',{width:200,height:200,videoId:opts.list?undefined:YT.q[YT.i].id,playerVars:pv,events:ev});
}
function ytTitle(){const t=$('ytT');if(!t)return;let n='';try{const d=YT.player.getVideoData();n=d&&d.title;}catch(e){}if(!n&&!YT.list&&YT.q[YT.i])n=YT.q[YT.i].n;t.textContent=n||'Memutar...';}
function ytStep(d){const p=YT.player;if(!p)return;if(YT.list){d>0?p.nextVideo():p.previousVideo();setTimeout(ytTitle,1200);return;}if(!YT.q.length)return;YT.i=(YT.i+d+YT.q.length)%YT.q.length;p.loadVideoById(YT.q[YT.i].id);setTimeout(ytTitle,1200);}
function ytStop(){try{YT.player&&YT.player.destroy();}catch(e){}YT.player=null;const c=$('ytCard');if(c)c.remove();}
function ytVol(){try{YT.player&&YT.player.setVolume(SET.mv);}catch(e){}}

function openMusic(){
  if(!started)return;if(modal)closeGame();if(modal)return;for(const k in keys)keys[k]=false;closePhone();
  const el=document.createElement('div');el.className='modal';
  el.innerHTML=`<div class="panel" role="dialog" aria-label="Musik"><div class="phead"><h3>🎵 Musik</h3><button class="pclose" aria-label="Tutup">✕</button></div><div class="pbody setb mub"></div></div>`;
  stage.appendChild(el);const body=el.querySelector('.mub');
  const draw=()=>{const cur=SET.music?SET.style||'lounge':'';
    body.innerHTML=`<section class="setg"><h4>Musik bawaan game</h4><p class="muted">Musik original buatan game, jalan tanpa internet.</p>
      ${STYLES.map(st=>`<div class="slotr"><div><b>${st.n}</b><small>${st.d}</small></div><button class="pbtn" data-st="${st.id}">${cur===st.id?'⏸ Stop':'▶ Putar'}</button></div>`).join('')}</section>
      <section class="setg"><h4>Lagu NCS (dari YouTube)</h4><p class="muted">Diputar lewat pemutar YouTube kecil yang bisa digeser. Butuh internet.</p>
      <div class="srow"><button class="pbtn" id="muAll">▶ Putar semua (acak)</button></div>
      ${NCS.map((t,i)=>`<div class="slotr"><div><b>${esc(t.n)}</b><small>NoCopyrightSounds</small></div><button class="pbtn" data-ncs="${i}">▶</button></div>`).join('')}</section>
      <section class="setg"><h4>Link YouTube sendiri</h4><p class="muted">Tempel link lagu atau playlist YouTube, misalnya playlist NCS favoritmu.</p>
      <div class="srow"><input id="muLink" placeholder="https://youtube.com/watch?v=..." style="flex:1;min-width:0"><button class="pbtn" id="muGo">Putar</button></div></section>
      <section class="setg"><h4>Volume musik</h4><label class="rng"><span>Volume</span><input type="range" id="muVol" min="0" max="100" value="${SET.mv}"><b id="muVolV">${SET.mv}%</b></label></section>
      <p class="pmsg" id="muMsg"></p>`;
    body.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{audio();const id=b.dataset.st;if(SET.music&&SET.style===id){SET.music=false;}else{ytStop();SET.style=id;SET.music=true;mstepX=0;}applyAudio();restartMusicTimer();draw();});
    body.querySelectorAll('[data-ncs]').forEach(b=>b.onclick=()=>{ytPlay({q:NCS.slice(),i:+b.dataset.ncs});draw();});
    $('muAll').onclick=()=>{const q=NCS.slice().sort(()=>Math.random()-.5);ytPlay({q,i:0});draw();};
    $('muGo').onclick=()=>{const r=ytParse($('muLink').value);if(!r.id&&!r.list){$('muMsg').textContent='Link YouTube tidak dikenali.';return;}
      if(r.list)ytPlay({list:r.list});else ytPlay({q:[{n:'Lagu pilihanmu',id:r.id}],i:0});$('muMsg').textContent='Memutar dari link.';};
    $('muVol').oninput=e=>{SET.mv=+e.target.value;$('muVolV').textContent=SET.mv+'%';applyAudio();ytVol();};
  };
  modal={el,st:{label:'Musik'},busy:false,refresh(){}};
  el.querySelector('.pclose').onclick=closeGame;el.addEventListener('pointerdown',e=>{if(e.target===el)closeGame();});
  draw();SFX.pop();

function wheelTexture(d){

    for(let i=0;i<37;i++){const n=ORDER[i],a0=i*SEG;
      g.fillStyle=d.gold&&n!==0?(RED.has(n)?'#e3a92b':'#5c3b0f'):colorOf(n);
      g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,a0,a0+SEG+.004);g.closePath();g.fill();
      g.strokeStyle='#ffd77a';g.lineWidth=2;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a0)*R,cy+Math.sin(a0)*R);g.stroke();

      g.fillStyle='#fff';g.font='700 24px Fredoka, Nunito, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(String(n),0,0);g.restore();}

  });
}

function spinWheel(w,n,dur){
  return new Promise(res=>{
    const i=ORDER.indexOf(n);
    let target=Math.PI/2+(i+.5)*SEG+(Math.random()-.5)*SEG*.6;
    const base=w.rot+Math.PI*2*4;
    target+=Math.ceil((base-target)/(Math.PI*2))*Math.PI*2;
    w.spin={from:w.rot,to:target,t0:performance.now(),dur,lastSeg:null,res};w.show=null;
    SFX.spinStart(volFor(w.center));
  });
}

  const L=Math.hypot(x2-x1,z2-z1),c=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,L,8),r);

/* ---------- mabar: room code multiplayer (PeerJS, host relays to everyone) ---------- */
const MP={peer:null,conns:{},host:false,code:null,myId:null,players:{},sendT:0,last:'',st:'off',err:'',duel:null,inv:null};
const MP_PRE='lounge-reme-v1-',MP_ABC='ABCDEFGHJKMNPQRSTUVWXYZ23456789',MP_MAX=6;
function mpOpts(){const m=location.hash.match(/peer=([^&]+)/);if(m){const [h,p]=decodeURIComponent(m[1]).split(':');return {host:h,port:+p||9000,path:'/',secure:false,debug:0};}return {debug:0};}
function mpLoad(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=()=>res();s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}
const mpName=()=>((SET.name||'').trim().slice(0,14)||'Pemain');
const mpOn=()=>MP.st==='host'||MP.st==='in';
function mpMe(){return {id:MP.myId,name:mpName(),look:youPal(),x:+you.pos.x.toFixed(2),y:+you.pos.y.toFixed(2),z:+you.pos.z.toFixed(2),yaw:+you.yaw.toFixed(2)};}
function mpSend(m,except){m.id=m.id||MP.myId;for(const k in MP.conns){if(k===except)continue;const c=MP.conns[k];if(c.open)try{c.send(m);}catch(e){}}}
function mpSetSt(st,err){MP.st=st;MP.err=err||'';mpBadge();if(modal&&modal.st&&modal.st.label==='Mabar')modal.refresh();document.getElementById('chatpanel').classList.toggle('mpc',mpOn());}
function mpBadge(){const b=$('btnMp');if(!b)return;const n=Object.keys(MP.players).length;b.dataset.n=mpOn()?String(n+1):'';b.classList.toggle('live',mpOn());}
function mpFail(e){const t=e&&e.type;const msg=t==='peer-unavailable'?'Room tidak ditemukan. Pastikan kodenya benar dan pembuat room sedang membuka game (bukan di WA/aplikasi lain), lalu coba lagi.':t==='ice'?'Room ketemu tapi koneksi ke HP temanmu gagal. Coba salah satu pakai data seluler, atau ganti Wi-Fi.':t==='browser-incompatible'?'Browser ini belum mendukung mabar. Coba Chrome terbaru.':t==='unavailable-id'?'Kode room bentrok, coba lagi.':'Gagal tersambung ke server mabar. Coba cek internet atau ganti jaringan.';mpLeave(true);mpSetSt('off',msg);SFX.error();}
async function mpStart(){if(MP.peer)mpLeave(true);mpSetSt('wait');try{await mpLoad();}catch(e){mpSetSt('off','Gagal memuat modul mabar. Cek koneksi internet.');return false;}return true;}
async function mpCreate(){
  if(!await mpStart())return;
  let code='';for(let i=0;i<4;i++)code+=MP_ABC[pick(MP_ABC.length)];
  const p=new Peer(MP_PRE+code,mpOpts());MP.peer=p;
  p.on('open',id=>{MP.myId=id;MP.host=true;MP.code=code;mpSetSt('host');logLine('sys',null,`Room mabar dibuat. Kode: ${code}. Bagikan ke temanmu.`);SFX.coin();});
  p.on('connection',c=>{if(Object.keys(MP.conns).length>=MP_MAX-1){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300);});return;}mpWire(c);});
  p.on('error',e=>{if(MP.st==='host'&&e&&['network','server-error','socket-error','socket-closed','disconnected','peer-unavailable','webrtc'].includes(e.type))return;mpFail(e);});p.on('disconnected',()=>{if(MP.peer===p&&!p.destroyed)try{p.reconnect();}catch(e){}});
}
async function mpJoin(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==4){mpSetSt('off','Kode room harus 4 huruf/angka.');return;}
  if(!await mpStart())return;
  const p=new Peer(undefined,mpOpts());MP.peer=p;MP.tries=0;
  const attempt=()=>{if(MP.peer!==p||MP.st!=='wait')return;MP.tries++;MP.err='';mpNote(`Mencari room ${code}... (percobaan ${MP.tries}/4)`);
    const c=p.connect(MP_PRE+code,{reliable:true});mpWire(c);
    const my=MP.tries;setTimeout(()=>{if(MP.peer===p&&MP.st==='wait'&&MP.tries===my){try{c.close();}catch(e){}
      if(MP.tries<4)attempt();else mpFail({type:'ice'});}},9000);};
  p.on('open',id=>{MP.myId=id;MP.host=false;MP.code=code;attempt();});
  p.on('error',e=>{if(e&&e.type==='peer-unavailable'&&MP.peer===p&&MP.tries<4){mpNote(`Room ${code} belum ketemu, coba lagi...`);const my=MP.tries;setTimeout(()=>{if(MP.tries===my)attempt();},2500);return;}mpFail(e);});
}
function mpNote(t){const m=document.getElementById('mMsg');if(m&&MP.st==='wait')m.textContent=t;}
function mpWire(c){
  c.on('open',()=>{MP.conns[c.peer]=c;if(!MP.host){mpSetSt('in');logLine('sys',null,`Masuk room ${MP.code}.`);SFX.coin();}c.send(Object.assign({t:'hello'},mpMe()));
    if(MP.host)for(const id in MP.players){const pl=MP.players[id];if(id!==c.peer&&pl.hello)c.send(Object.assign({},pl.hello,{x:pl.tx.x,y:pl.tx.y,z:pl.tx.z,yaw:pl.tyaw}));}});
  c.on('data',d=>mpData(c,d));
  const gone=()=>{delete MP.conns[c.peer];if(MP.host){if(MP.players[c.peer]){mpDrop(c.peer);mpSend({t:'bye',id:c.peer});}}else if(MP.st==='in'){logLine('sys',null,'Room ditutup oleh pembuatnya.');mpLeave(true);mpSetSt('off','Room sudah ditutup.');}};
  c.on('close',gone);c.on('error',gone);
}
function mpData(c,d){
  if(!d||typeof d!=='object'||typeof d.t!=='string')return;
  if(d.t==='full'){mpLeave(true);mpSetSt('off',`Room penuh (maks ${MP_MAX} orang).`);return;}
  if(MP.host){d.id=c.peer;mpSend(d,c.peer);}   // host relays with a trusted sender id
  if(d.id===MP.myId)return;
  if(d.to&&d.to!==MP.myId)return;
  const pl=MP.players[d.id];
  switch(d.t){
    case 'hello':mpAdd(d);break;

function syncTenants(){const b=bizS();HOUSES.forEach(H=>{const s=b.h[H.id],want=s&&s.ten,e=tenantEnts[H.id];
  if(want&&(!e||e.name!==s.ten.n)){if(e)dropEnt(e);const [x,z]=H.yard;const n=mkEnt(s.ten.n,x,z,randPal(),{label:'Penyewa '+s.ten.n,color:'#7df3ff'});n.yaw=H.ry;ents.push(n);tenantEnts[H.id]=n;}

function bizPay(p){if(S.bal<p){SFX.error();showResult(`Koin kurang. Butuh 🪙 <b>${fmt(p)}</b>`);return false;}S.bal-=p;return true;}
function bizDone(msg,cls){if(msg)logLine('sys',null,msg,cls);SFX.coin();save();savePF();render();refreshBizSigns();syncTenants();ctxKey=null;phoneRender();}
function bizDo(a,id){const b=bizS();
  if(a==='go'){goPlace(id);return;}
  if(a==='floor'){mallGo(+id);return;}
  if(a==='buyK'){const K=KIOSKS.find(k=>k.id===id);if(!K||b.k[id]||!bizPay(K.p))return;b.k[id]=1;bizDone(`🏪 Kamu membeli kios ${K.n}. Penghasilan ${fmt(K.p*.05)} koin per hari bursa.`,'win');showResult(`🏪 <b>${K.n}</b> jadi milikmu!`);return;}
  if(a==='sellK'){const K=KIOSKS.find(k=>k.id===id);if(!K||!b.k[id])return;delete b.k[id];S.bal+=Math.round(K.p*.7);bizDone(`Kios ${K.n} dijual. +${fmt(Math.round(K.p*.7))} koin.`);return;}
  if(a==='buyM'){const U=MUNITS.find(u=>u.id===id);if(!U||b.m[id]||!bizPay(U.p))return;b.m[id]=1;bizDone(`🏬 Kamu membeli unit ${U.n} di lantai ${U.k+1}. Merchant bayar sewa ${fmt(U.p*.04)} koin per hari.`,'win');showResult(`🏬 Unit <b>${U.n}</b> milikmu!`);return;}
  if(a==='sellM'){const U=MUNITS.find(u=>u.id===id);if(!U||!b.m[id])return;delete b.m[id];S.bal+=Math.round(U.p*.7);bizDone(`Unit ${U.n} dijual. +${fmt(Math.round(U.p*.7))} koin.`);return;}
  if(a==='buyA'){if(b.ag||!bizPay(AGENCY.p))return;b.ag=1;bizDone(`🏢 Agen Properti Permata sekarang milikmu! Diskon 10% beli rumah, sewa & tawaran +10%, plus komisi harian.`,'win');showResult('🏢 Agen properti milikmu!');return;}
  if(a==='sellA'){if(!b.ag)return;b.ag=0;S.bal+=Math.round(AGENCY.p*.7);bizDone(`Agen properti dijual. +${fmt(Math.round(AGENCY.p*.7))} koin.`);return;}
  const H=HOUSES.find(h=>h.id===id);if(!H)return;const s=b.h[id];
  if(a==='buyH'){if(s)return;const p=housePrice(H);if(!bizPay(p))return;b.h[id]={v:H.p,ten:null,cand:null,off:null};bizDone(`🏡 Kamu membeli ${H.n} seharga ${fmt(p)} koin.`,'win');showResult(`🏡 <b>${H.n}</b> milikmu!`);return;}
  if(!s)return;
  if(a==='rentH'){if(!s.cand)return;s.ten=s.cand;s.cand=null;bizDone(`🏡 ${s.ten.n} mulai menyewa ${H.n}. Sewa ${fmt(s.ten.rent)} koin per hari.`,'win');return;}
  if(a==='noH'){s.cand=null;bizDone(null);return;}
  if(a==='evictH'){if(!s.ten)return;logLine('sys',null,`${s.ten.n} selesai menyewa ${H.n}.`);s.ten=null;bizDone(null);return;}
  if(a==='sellH'){if(!s.off)return;const p=s.off.p,n=s.off.n;delete b.h[id];S.bal+=p;bizDone(`🏡 ${H.n} terjual ke ${n} seharga ${fmt(p)} koin!`,'win');showResult(`🏡 Terjual! +🪙 <b>${fmt(p)}</b>`);return;}
  if(a==='quickH'){const p=Math.round(s.v*.9);delete b.h[id];S.bal+=p;bizDone(`${H.n} dijual cepat ke agen. +${fmt(p)} koin.`);return;}
}

    if(!s.off&&Math.random()<.25){s.off={n:NAMES[pick(NAMES.length)],p:Math.round(s.v*(1.1+Math.random()*.3)*(b.ag?1.1:1)/1000)*1000,until:now+240000};logLine('sys',null,`💰 ${s.off.n} menawar ${H.n} seharga ${fmt(s.off.p)} koin (4 menit).`);note=true;}});
  if(pay>0||note){save();savePF();render();ctxKey=null;phoneRender();}}
